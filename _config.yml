
# The Site Configuration

theme: jekyll-theme-chirpy

# Language and timezone
lang: en
timezone: America/New_York

# SEO Settings
title: Farid Waddi
tagline: Software Quality Assurance | Software Testing
description: >-
  Welcome to my blog. I share practical knowledge about Software Quality
  Assurance, manual testing, test cases, bug reporting, API testing,
  mobile testing, and software testing techniques.

url: "https://faridwaddi.github.io"
baseurl: ""

# GitHub
github:
  username: FaridWaddi

# Twitter
twitter:
  username:

# Social Information
social:
  name: Farid Waddi
  email:
  fediverse_handle:
  links:
    - https://github.com/FaridWaddi

# Site Verification
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Analytics
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page Views
pageviews:
  provider:

# Theme Mode
theme_mode:

# CDN
cdn:

# Avatar
avatar:

# Social Preview Image
social_preview_image:

# Table of Contents
toc: true

# Edit Post Action
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# Comments
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Assets
assets:
  self_host:
    enabled:
    env:

# Progressive Web App
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# Pagination
paginate: 10

# Kramdown
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Sass
sass:
  style: compressed

# HTML Compression
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs:
      - development

# Exclude
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# Jekyll Archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
